[package]
name = "tonight"
version = "0.1.0"
edition = "2021"
description = "「今晚玩什么」——Steam 游戏库推荐 Agent"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "sync"] }
tokio-stream = "0.1"
tokio-util = "0.7"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
governor = "0.7"
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
fs4 = "0.12"

[target.'cfg(unix)'.dependencies]
fs4 = "0.12"

[profile.release]
strip = true
lto = "thin"
